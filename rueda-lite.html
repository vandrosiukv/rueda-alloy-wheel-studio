<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rueda · Alloy Wheel Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6efe4; --bg-2:#fdf8ee; --surface:#fff; --surface-2:#f1e9db;
  --border:#e4d9c4; --border-2:#cdbea3;
  --ink:#1f1a14; --ink-2:#3f362a; --muted:#7a6d58;
  --primary:#9a3b20; --primary-soft:#f0d5c4;
  --accent:#e0a024; --olive:#6e7a3a; --olive-soft:#dde0c3;
  --indigo:#1f3a5f;
  --radius:14px; --radius-sm:8px; --radius-lg:20px;
  --shadow-sm:0 1px 2px rgba(60,40,20,.06),0 2px 4px rgba(60,40,20,.04);
  --shadow-md:0 4px 12px rgba(60,40,20,.08),0 2px 4px rgba(60,40,20,.04);
  --shadow-lg:0 18px 40px -12px rgba(60,40,20,.18),0 6px 14px rgba(60,40,20,.08);
  --sans:'Space Grotesk',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
[data-theme="dark"]{
  --bg:#16120d; --bg-2:#1d1811; --surface:#241e15; --surface-2:#2d261b;
  --border:#3a3224; --border-2:#4f4532;
  --ink:#f3ead9; --ink-2:#d8cbb1; --muted:#9b8c6e;
  --primary:#d96a42; --primary-soft:#3a2015;
  --accent:#f0b851; --olive:#a3b05b; --olive-soft:#2b3119;
  --indigo:#6b8ab2;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans); color:var(--ink); background:var(--bg);
  font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--mono)}
.tabular{font-variant-numeric:tabular-nums}
.sub{color:var(--muted)}
.strong{font-weight:600}
.row{display:flex;gap:12px;align-items:center}
.col{display:flex;flex-direction:column;gap:14px}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px}
.wrap{flex-wrap:wrap}
.mt-1{margin-top:4px}.mt-2{margin-top:8px}.mt-3{margin-top:14px}.mt-4{margin-top:22px}
.mb-2{margin-bottom:8px}.mb-3{margin-bottom:14px}.mb-4{margin-bottom:22px}

.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.sidebar{
  position:sticky;top:0;height:100vh;
  border-right:1px solid var(--border); background:var(--bg-2);
  padding:22px 16px; display:flex;flex-direction:column;gap:6px;
}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand-mark{
  width:34px;height:34px;border-radius:50%;
  background:
    radial-gradient(circle at 50% 50%, var(--surface) 22%, transparent 23%),
    conic-gradient(from 0deg, var(--primary), var(--accent), var(--olive), var(--indigo), var(--primary));
  border:1.5px solid var(--ink); position:relative;
}
.brand-mark::after{content:"";position:absolute;inset:4px;border-radius:50%;border:1px dashed var(--ink);opacity:.35}
.brand-name{font-weight:700;letter-spacing:-.01em;font-size:19px}
.brand-sub{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.nav-label{font-family:var(--mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);padding:14px 10px 6px}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;
  width:100%; text-align:left; color:var(--ink-2); font-size:13.5px; font-weight:500;
  transition:background .12s,color .12s;
}
.nav-item:hover{background:var(--surface-2)}
.nav-item.active{background:var(--ink);color:var(--bg-2)}
.nav-item .nav-badge{
  margin-left:auto; background:var(--primary);color:#fff;
  border-radius:999px;padding:1px 7px;font-family:var(--mono);font-size:10px;font-weight:600;
}
.nav-item.active .nav-badge{background:var(--accent);color:var(--ink)}
.sidebar-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--border)}
.avatar{
  width:34px;height:34px;border-radius:50%;background:var(--primary);color:#fff;
  display:grid;place-items:center;font-family:var(--mono);font-weight:600;font-size:12px;
}
.user-chip{display:flex;align-items:center;gap:10px;padding:10px 8px;border-radius:10px}
.user-name{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-tier{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}

.main{padding:22px 30px 80px}
.topbar{
  display:flex;align-items:center;gap:10px;
  padding-bottom:18px;margin-bottom:22px;border-bottom:1px solid var(--border);
  position:sticky;top:0;background:var(--bg);z-index:5;padding-top:4px;
}
.topbar h1{margin:0;font-size:22px;font-weight:600;letter-spacing:-.015em}
.topbar-sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.spacer{flex:1}
.icon-btn{
  width:36px;height:36px;border-radius:10px;border:1px solid var(--border);
  background:var(--surface); color:var(--ink-2);
  display:inline-flex;align-items:center;justify-content:center;
  transition:background .12s,border-color .12s;
}
.icon-btn:hover{background:var(--surface-2);border-color:var(--border-2)}
.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:9px 14px;border-radius:10px;border:1px solid var(--border);
  background:var(--surface); color:var(--ink); font-weight:500; font-size:13.5px;
  transition:background .12s,border-color .12s,transform .08s;
}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--ink);color:var(--bg-2);border-color:var(--ink)}
.btn.primary:hover{background:var(--ink-2)}
.btn.accent{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn.accent:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;border-color:var(--border)}
.btn.danger{background:transparent;color:var(--primary);border-color:color-mix(in oklch,var(--primary) 50%,var(--border))}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.4;cursor:not-allowed}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow-sm)}
.card.lg{padding:22px;border-radius:var(--radius-lg)}
.card .ctitle{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:600;font-size:15px;margin-bottom:14px}
.eyebrow{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;font-weight:500}

.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}

.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.kpi-label{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
.kpi-value{font-size:24px;font-weight:600;letter-spacing:-.01em;margin-top:6px}
.kpi-foot{font-size:11.5px;color:var(--muted);margin-top:4px}
.kpi.accent{background:linear-gradient(135deg,var(--primary) 0%,#b8492b 100%);color:#fff;border-color:transparent}
.kpi.accent .kpi-label,.kpi.accent .kpi-foot{color:rgba(255,255,255,.8)}

.pill{
  display:inline-flex;align-items:center;gap:5px;
  padding:2px 8px;border-radius:999px;border:1px solid var(--border);
  font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;color:var(--muted);background:var(--surface);
}
.pill.primary{background:var(--primary-soft);border-color:color-mix(in oklch,var(--primary) 30%,var(--border));color:var(--primary)}
.pill.accent{background:color-mix(in oklch,var(--accent) 25%,var(--surface));border-color:color-mix(in oklch,var(--accent) 40%,var(--border));color:var(--ink)}
.pill.olive{background:var(--olive-soft);border-color:color-mix(in oklch,var(--olive) 30%,var(--border));color:var(--olive)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}

.booking{display:flex;gap:14px;align-items:center;padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--bg-2)}
.bdate{width:48px;text-align:center;flex:none}
.bdate .d{font-size:22px;font-weight:700;line-height:1}
.bdate .m{font-family:var(--mono);font-size:10px;color:var(--muted);text-transform:uppercase;margin-top:2px}
.bmain{flex:1;min-width:0}
.btitle{font-weight:600;font-size:14px}
.bmeta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:4px;font-size:12px;color:var(--muted)}

.tbl{width:100%;border-collapse:collapse}
.tbl th,.tbl td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--border);font-size:13px}
.tbl th{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500}
.tbl tr:last-child td{border-bottom:0}

.input,.select,textarea.input{
  width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface);
  font-family:inherit;font-size:13.5px;color:var(--ink);
}
.input:focus,.select:focus,textarea.input:focus{outline:2px solid color-mix(in oklch,var(--primary) 40%,transparent);outline-offset:-1px;border-color:var(--primary)}
.field label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}

.wheel{
  --s:56px; width:var(--s); height:var(--s); border-radius:50%; flex:none;
  background:
    radial-gradient(circle at 50% 50%, var(--surface) 14%, transparent 15%),
    radial-gradient(circle at 50% 50%, var(--border-2) 17%, transparent 18%),
    conic-gradient(from 0deg, var(--ink-2) 0 8%, transparent 8% 20%, var(--ink-2) 20% 28%, transparent 28% 40%, var(--ink-2) 40% 48%, transparent 48% 60%, var(--ink-2) 60% 68%, transparent 68% 80%, var(--ink-2) 80% 88%, transparent 88% 100%);
  border:2px solid var(--ink); position:relative;
  box-shadow:inset 0 0 0 calc(var(--s) * .06) var(--surface);
}
.wheel::after{content:"";position:absolute;inset:calc(50% - 4px) calc(50% - 4px);width:8px;height:8px;border-radius:50%;background:var(--ink)}

.steps{display:flex;gap:0;margin-bottom:22px;border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:4px}
.step{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px;border-radius:9px;color:var(--muted);font-size:13px;font-weight:500}
.step.active{background:var(--ink);color:var(--bg-2)}
.step.done{color:var(--olive)}
.step .n{width:22px;height:22px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-family:var(--mono);font-size:11px;font-weight:600}
.step.active .n{background:var(--accent);color:var(--ink)}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.1em;text-align:center;padding:6px 0;text-transform:uppercase}
.cell{
  min-height:52px;border-radius:9px;padding:6px 8px;background:var(--surface);border:1px solid var(--border);
  font-family:var(--mono);font-size:12px;color:var(--ink);display:flex;flex-direction:column;align-items:flex-start;transition:all .1s;
}
.cell:hover:not(:disabled){border-color:var(--primary);transform:translateY(-1px)}
.cell.off{opacity:.3;cursor:not-allowed}
.cell.today{border-color:var(--accent)}
.cell.sel{background:var(--primary);color:#fff;border-color:var(--primary)}
.cell.has::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--primary);position:absolute}
.cell{position:relative}

.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.slot{
  padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--surface);
  font-family:var(--mono);font-size:12.5px;font-weight:500;transition:all .1s;
}
.slot:hover:not(:disabled){border-color:var(--primary)}
.slot:disabled{opacity:.35;text-decoration:line-through}
.slot.sel{background:var(--primary);color:#fff;border-color:var(--primary)}

.svc{border:1px solid var(--border);border-radius:16px;background:var(--surface);overflow:hidden;display:flex;flex-direction:column;transition:all .2s}
.svc:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.svc-hero{
  padding:18px;background:linear-gradient(135deg, var(--surface-2) 0%, var(--bg-2) 100%);
  border-bottom:1px solid var(--border); position:relative;
}
.svc-body{padding:16px;display:flex;flex-direction:column;gap:10px;flex:1}
.svc-title{font-weight:600;font-size:15px;letter-spacing:-.01em}
.svc-desc{font-size:12.5px;color:var(--muted);line-height:1.45}
.svc-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding-top:10px;border-top:1px dashed var(--border)}
.svc-price{font-family:var(--mono);font-weight:600;font-size:17px;letter-spacing:-.01em}
.svc-price small{font-size:10px;color:var(--muted);font-weight:400}

.bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-top:10px}
.bar-fill{height:100%;background:var(--primary);border-radius:inherit;transition:width .5s cubic-bezier(.2,.8,.2,1)}

.loy-hero{
  background:linear-gradient(135deg,var(--indigo) 0%, #2e5485 100%);
  color:#fff; padding:24px; border-radius:var(--radius-lg); overflow:hidden; position:relative;
}
.loy-hero::before{
  content:"";position:absolute;top:-40px;right:-40px;width:180px;height:180px;border-radius:50%;
  background:radial-gradient(circle,var(--accent),transparent 70%); opacity:.3;
}
.loy-tier-name{font-size:32px;font-weight:700;letter-spacing:-.02em;margin-top:6px}
.loy-hero .bar{background:rgba(255,255,255,.2)}
.loy-hero .bar-fill{background:var(--accent)}
.tiers{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:1000px){.tiers{grid-template-columns:repeat(2,1fr)}}
.tier{border:1px solid var(--border);border-radius:14px;padding:16px;background:var(--surface)}
.tier.cur{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in oklch,var(--primary) 16%,transparent)}
.tier-name{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
.tier-thresh{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:2px}
.tier-perks{list-style:none;padding:0;margin:12px 0 0;display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.tier-perks li{display:flex;gap:8px;align-items:flex-start}
.tier-perks li::before{content:"·";color:var(--primary);font-weight:700}

/* language menu */
.lang-btn{
  display:inline-flex;align-items:center;gap:6px;padding:0 12px;height:36px;
  border:1px solid var(--border);border-radius:10px;background:var(--surface);
  font-family:var(--mono);font-size:12px;font-weight:600;color:var(--ink-2);
}
.lang-btn:hover{background:var(--surface-2)}
.lang-pop{
  position:absolute;top:calc(100% + 6px);right:0;z-index:30;
  background:var(--surface);border:1px solid var(--border);border-radius:12px;
  box-shadow:var(--shadow-lg); padding:6px; min-width:180px; display:flex;flex-direction:column;gap:2px;
}
.lang-item{
  display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;
  text-align:left; color:var(--ink); font-size:13px;
}
.lang-item:hover{background:var(--surface-2)}
.lang-item.cur{background:var(--primary-soft);color:var(--primary)}
.lang-item .code{font-family:var(--mono);font-size:10px;color:var(--muted);width:22px;font-weight:600}
.lang-item.cur .code{color:var(--primary)}

.toast-stack{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:100}
.toast{
  background:var(--ink);color:var(--bg-2);padding:10px 14px;border-radius:12px;
  box-shadow:var(--shadow-lg);font-size:13px; display:flex;align-items:center;gap:10px;
  animation:slide .25s ease;
}
@keyframes slide{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}

.modal-bg{position:fixed;inset:0;background:rgba(30,20,10,.45);z-index:50;display:grid;place-items:center;padding:20px}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:18px;max-width:520px;width:100%;box-shadow:var(--shadow-lg);overflow:hidden}
.modal-head{padding:18px 22px 6px}
.modal-body{padding:16px 22px}
.modal-foot{padding:14px 22px 18px;display:flex;gap:10px;justify-content:flex-end;border-top:1px solid var(--border);background:var(--bg-2)}

/* ── Mobile adaptation ── */
.mobile-menu-btn{display:none}
.sidebar-overlay{display:none}
.bottom-nav{display:none}

@media(max-width:768px){
  /* viewport fix */
  html,body{height:100%;overflow:hidden}
  .app{height:100dvh;overflow:hidden;display:flex;flex-direction:column}

  /* sidebar: slide-in drawer */
  .sidebar{
    position:fixed;inset:0 auto 0 0;z-index:40;width:260px;
    transform:translateX(-100%);transition:transform .28s cubic-bezier(.4,0,.2,1);
  }
  .sidebar-is-open .sidebar{transform:translateX(0)}
  .sidebar-overlay{
    display:block;position:fixed;inset:0;z-index:39;
    background:rgba(0,0,0,.4);backdrop-filter:blur(2px);
  }

  /* main scrolls inside */
  .main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(60px + env(safe-area-inset-bottom))}

  /* topbar */
  .topbar{padding:0 10px;gap:6px}
  .mobile-menu-btn{display:flex}
  .topbar h1{font-size:15px}
  .topbar-sub{display:none}

  /* bottom nav */
  .bottom-nav{
    display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;
    background:var(--surface);border-top:1px solid var(--border);
    padding-bottom:env(safe-area-inset-bottom);
    min-height:54px;
  }
  .bottom-nav-item{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:3px;font-size:9.5px;color:var(--muted);padding:6px 0;position:relative;
    transition:color .15s;
  }
  .bottom-nav-item.active{color:var(--primary)}
  .bottom-nav-item span{line-height:1}
  .bottom-nav-badge{
    position:absolute;top:4px;right:calc(50% - 16px);
    background:var(--danger,#e74c3c);color:#fff;
    border-radius:999px;font-size:9px;font-weight:700;
    min-width:16px;height:16px;display:flex;align-items:center;justify-content:center;padding:0 3px;
  }

  /* content grids */
  .dash-grid,.stats,.tiers{grid-template-columns:1fr!important}
  .svc-grid{grid-template-columns:1fr!important}
  .page{padding:14px}

  /* inputs — prevent iOS zoom */
  input,select,textarea{font-size:16px!important}

  /* modal → bottom sheet */
  .modal-bg{align-items:flex-end;padding:0}
  .modal{border-radius:18px 18px 0 0;max-width:100%;max-height:90dvh;overflow-y:auto}
  .modal-foot{padding-bottom:calc(14px + env(safe-area-inset-bottom))}
}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="rueda/i18n.jsx"></script>
<script type="text/babel" src="rueda/data.jsx"></script>
<script type="text/babel" src="rueda/components.jsx"></script>
<script type="text/babel" src="rueda/views.jsx"></script>
<script type="text/babel" src="rueda/app.jsx"></script>
</body>
